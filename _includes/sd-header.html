{% include base_path %}
<header class="sd-header">
  <div class="sd-wrap sd-header__inner">
    <a class="sd-brand" href="{{ base_path }}/" aria-label="{{ site.title }} — home">
      <span class="sd-brand__mark">SD</span>
      <span class="sd-brand__name">{{ site.title }}</span>
    </a>
    <nav class="sd-nav" aria-label="Main">
      <a href="{{ base_path }}/" {% if page.url == "/" %}aria-current="page"{% endif %}>About</a>
      {% for link in site.data.navigation.main %}
        <a href="{% unless link.url contains 'http' %}{{ base_path }}{% endunless %}{{ link.url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
      <button class="sd-theme" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="sd-theme__sun">{% include icon.html name="sun" %}</span>
        <span class="sd-theme__moon">{% include icon.html name="moon" %}</span>
      </button>
    </nav>
  </div>
</header>
