---
layout: sd-base
---
<section class="sd-pagehead">
  <div class="sd-hero__bg sd-hero__bg--soft" aria-hidden="true"></div>
  <div class="sd-wrap">
    {% if page.eyebrow %}<p class="sd-eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="sd-pagehead__title">{{ page.title }}</h1>
    {% if page.lede %}<p class="sd-pagehead__lede">{{ page.lede | markdownify | remove: '<p>' | remove: '</p>' }}</p>{% endif %}
  </div>
</section>

<div class="sd-wrap sd-page">
  {{ content }}
</div>
